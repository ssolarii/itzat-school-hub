&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      },
    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

}#isa-glance .isa-week-column .isa-location{grid-column:auto;text-align:right}#isa-glance .isa-exception{padding:22px}#isa-glance .isa-exception h2{font-size:28px}}
@media(prefers-reduced-motion:no-preference){#isa-glance .isa-navigation button,#isa-glance .isa-navigation a{transition:background-color 120ms ease-out,color 120ms ease-out}}
&lt;/style&gt;
&lt;script&gt;
(()=&gt;{
 const root=document.getElementById(&#x27;isa-glance&#x27;),product=root.querySelector(&#x27;.isa-product&#x27;);
 const timetable=[
 [[&#x27;QR&#x27;,&#x27;D2&#x27;],[&#x27;FA&#x27;,&#x27;FAS&#x27;],[&#x27;LA&#x27;,&#x27;D1&#x27;],[&#x27;S&amp;T&#x27;,&#x27;D4&#x27;],[&#x27;Span&#x27;,&#x27;N5&#x27;],[&#x27;BS&#x27;,&#x27;N3&#x27;]],
 [[&#x27;QR&#x27;,&#x27;D2&#x27;],[&#x27;DA&amp;M&#x27;,&#x27;DAS&#x27;],[&#x27;FA&#x27;,&#x27;FAS&#x27;],[&#x27;LA&#x27;,&#x27;D1&#x27;],[&#x27;S&amp;T&#x27;,&#x27;D4&#x27;],[&#x27;M&#x27;,&#x27;MS&#x27;]],
 [[&#x27;FA&#x27;,&#x27;FAS&#x27;],[&#x27;LA&#x27;,&#x27;D1&#x27;],[&#x27;M&#x27;,&#x27;MS&#x27;],[&#x27;M&#x27;,&#x27;MS&#x27;],[&#x27;QR&#x27;,&#x27;D2&#x27;],[&#x27;FL&amp;E&#x27;,&#x27;N2&#x27;]],
 [[&#x27;S&amp;T&#x27;,&#x27;D4&#x27;],[&#x27;M&#x27;,&#x27;MS&#x27;],[&#x27;DA&amp;M&#x27;,&#x27;DAS&#x27;],[&#x27;LS&#x27;,&#x27;N3&#x27;],[&#x27;LA&#x27;,&#x27;D1&#x27;],[&#x27;QR&#x27;,&#x27;D2&#x27;]],
 [[&#x27;QR&#x27;,&#x27;D2&#x27;],[&#x27;DA&amp;M&#x27;,&#x27;DAS&#x27;],[&#x27;Span&#x27;,&#x27;N5&#x27;],[&#x27;PE&#x27;,&#x27;&#x27;],[&#x27;CP&#x27;,&#x27;N4&#x27;],[&#x27;CP&#x27;,&#x27;N4&#x27;]],
 [[&#x27;LA&#x27;,&#x27;D1&#x27;],[&#x27;DA&amp;M&#x27;,&#x27;DAS&#x27;],[&#x27;DA&amp;M&#x27;,&#x27;DAS&#x27;],[&#x27;S&amp;T&#x27;,&#x27;D4&#x27;],[&#x27;PE&#x27;,&#x27;&#x27;],[&#x27;A&#x27;,&#x27;MS&#x27;]],
 [[&#x27;DA&amp;M&#x27;,&#x27;DAS&#x27;],[&#x27;BS&#x27;,&#x27;N3&#x27;],[&#x27;LA&#x27;,&#x27;D1&#x27;],[&#x27;QR&#x27;,&#x27;D2&#x27;]]];
 const names={LA:&#x27;Language Arts&#x27;,Span:&#x27;Spanish&#x27;,M:&#x27;Math&#x27;,PE:&#x27;Physical Education&#x27;,CP:&#x27;Career Pathway&#x27;};
 const starts=[&#x27;8:00&#x27;,&#x27;9:00&#x27;,&#x27;10:05&#x27;,&#x27;11:05&#x27;,&#x27;1:00&#x27;,&#x27;2:05&#x27;],ends=[&#x27;8:55&#x27;,&#x27;9:55&#x27;,&#x27;11:00&#x27;,&#x27;12:00&#x27;,&#x27;1:55&#x27;,&#x27;3:00&#x27;];
 let state=&#x27;school&#x27;,kind=&#x27;regular&#x27;,group=&#x27;3CS&#x27;,view=&#x27;today&#x27;,offline=false;
 const subject=code=&gt;`&lt;details class=&quot;isa-subject&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;${code}&lt;i data-lucide=&quot;chevron-down&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/summary&gt;&lt;span class=&quot;isa-full-name&quot;&gt;${names[code]||&#x27;Full name not published&#x27;}&lt;/span&gt;&lt;/details&gt;`;
 const nextDay=()=&gt;kind===&#x27;holiday&#x27;?5:6;
 function row(v,i,live=false,compact=false){return `&lt;div class=&quot;isa-row ${live&amp;&amp;i===2?&#x27;is-current&#x27;:live&amp;&amp;i&lt;2?&#x27;is-finished&#x27;:&#x27;&#x27;}&quot;&gt;&lt;time&gt;${starts[i]}${compact?&#x27;&#x27;:`&lt;span&gt;to ${ends[i]}&lt;/span&gt;`}&lt;/time&gt;${subject(v[0])}&lt;div class=&quot;isa-location&quot;&gt;${live&amp;&amp;i===2?&#x27;&lt;span class=&quot;isa-current-label&quot;&gt;Now&lt;/span&gt;&#x27;:live&amp;&amp;i===3?&#x27;&lt;span class=&quot;isa-current-label&quot;&gt;Next&lt;/span&gt;&#x27;:&#x27;&#x27;}${v[1]||&#x27;&lt;small&gt;Room pending&lt;/small&gt;&#x27;}&lt;/div&gt;&lt;/div&gt;`;}
 function rows(day,live=false,compact=false){const r=timetable[day-1].map((v,i)=&gt;(i===4&amp;&amp;!compact?&#x27;&lt;div class=&quot;isa-break&quot;&gt;12:00–1:00 · Lunch&lt;/div&gt;&#x27;:&#x27;&#x27;)+row(v,i,live,compact));return live?`&lt;div class=&quot;isa-earlier-desktop&quot;&gt;${r.slice(0,2).join(&#x27;&#x27;)}&lt;/div&gt;${r.slice(2).join(&#x27;&#x27;)}&lt;details class=&quot;isa-earlier-mobile&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Earlier today · 2 lessons&lt;/summary&gt;${r.slice(0,2).join(&#x27;&#x27;)}&lt;/details&gt;`:r.join(&#x27;&#x27;);}
 function dismissal(day){return `&lt;p class=&quot;isa-dismissal&quot;&gt;${day===7?&#x27;Half day · four student sessions&#x27;:&#x27;School ends at 3:15 PM&#x27;}&lt;/p&gt;${day===7?&#x27;&lt;p class=&quot;isa-halfday-note&quot;&gt;Dismissal time to confirm. PLC is staff planning.&lt;/p&gt;&#x27;:&#x27;&#x27;}`;}
 function exception(){if(kind===&#x27;async&#x27;)return &#x27;&lt;div class=&quot;isa-exception&quot;&gt;&lt;h2&gt;Independent work today&lt;/h2&gt;&lt;p&gt;No campus classes or live online lessons. Your work is in Classroom.&lt;/p&gt;&lt;a href=&quot;https://classroom.google.com/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; class=&quot;cursor-interaction&quot;&gt;Open Classroom&lt;/a&gt;&lt;p&gt;Day 5 still counts. Next school day: Day 6.&lt;/p&gt;&lt;/div&gt;&#x27;;if(kind===&#x27;parade&#x27;)return &#x27;&lt;div class=&quot;isa-exception&quot;&gt;&lt;h2&gt;It’s parade day&lt;/h2&gt;&lt;p&gt;Regular lessons are replaced by the school event. Meeting time and place will appear here once published.&lt;/p&gt;&lt;p&gt;Day 5 still counts. Next school day: Day 6.&lt;/p&gt;&lt;/div&gt;&#x27;;return &#x27;&lt;div class=&quot;isa-exception&quot;&gt;&lt;h2&gt;No school today&lt;/h2&gt;&lt;p&gt;The holiday pauses the cycle. Tuesday will still be Day 5.&lt;/p&gt;&lt;/div&gt;&#x27;;}
 function now(){if(state===&#x27;before&#x27;)return `&lt;section class=&quot;isa-now&quot;&gt;&lt;div class=&quot;isa-status-line&quot;&gt;&lt;span&gt;First class&lt;/span&gt;&lt;span&gt;8:00 AM&lt;/span&gt;&lt;/div&gt;${subject(&#x27;QR&#x27;)}&lt;p class=&quot;isa-room&quot;&gt;Room D2&lt;/p&gt;&lt;p class=&quot;isa-countdown&quot;&gt;20 min &lt;span&gt;to start&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;isa-end&quot;&gt;School starts at 8:00 AM&lt;/p&gt;&lt;div class=&quot;isa-next-lesson&quot;&gt;&lt;div class=&quot;isa-status-line&quot;&gt;&lt;span&gt;Then&lt;/span&gt;&lt;span&gt;9:00 AM&lt;/span&gt;&lt;/div&gt;${subject(&#x27;DA&amp;M&#x27;)}&lt;p class=&quot;isa-room&quot;&gt;Room DAS&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;`;if(state===&#x27;lunch&#x27;)return `&lt;section class=&quot;isa-now&quot;&gt;&lt;h2&gt;Lunch break&lt;/h2&gt;&lt;p class=&quot;isa-countdown&quot;&gt;15 min &lt;span&gt;left&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;isa-end&quot;&gt;Ends at 1:00 PM&lt;/p&gt;&lt;div class=&quot;isa-next-lesson&quot;&gt;&lt;div class=&quot;isa-status-line&quot;&gt;&lt;span&gt;Next&lt;/span&gt;&lt;span&gt;1:00 PM&lt;/span&gt;&lt;/div&gt;${subject(&#x27;CP&#x27;)}&lt;p class=&quot;isa-room&quot;&gt;Room N4&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;`;return `&lt;section class=&quot;isa-now&quot;&gt;&lt;div class=&quot;isa-status-line&quot;&gt;&lt;span&gt;Now&lt;/span&gt;&lt;span&gt;10:38 AM&lt;/span&gt;&lt;/div&gt;${subject(&#x27;Span&#x27;)}&lt;p class=&quot;isa-room&quot;&gt;Room N5&lt;/p&gt;&lt;p class=&quot;isa-countdown&quot;&gt;22 min &lt;span&gt;left&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;isa-end&quot;&gt;Ends at 11:00 AM&lt;/p&gt;&lt;div class=&quot;isa-next-lesson&quot;&gt;&lt;div class=&quot;isa-status-line&quot;&gt;&lt;span&gt;Next&lt;/span&gt;&lt;span&gt;11:05 AM&lt;/span&gt;&lt;/div&gt;${subject(&#x27;PE&#x27;)}&lt;p class=&quot;isa-room&quot;&gt;Room to confirm&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;`;}
 function week(){return `&lt;div class=&quot;isa-week&quot;&gt;&lt;section class=&quot;isa-week-column is-holiday&quot;&gt;&lt;p class=&quot;isa-week-date&quot;&gt;Mon 12 Oct&lt;/p&gt;&lt;h2 class=&quot;isa-week-day&quot;&gt;Holiday&lt;/h2&gt;&lt;p&gt;Cycle pauses.&lt;br&gt;Back on Tuesday.&lt;/p&gt;&lt;/section&gt;${[13,14,15,16].map((date,i)=&gt;{const d=((nextDay()-1+i)%7)+1;return `&lt;section class=&quot;isa-week-column&quot;&gt;&lt;p class=&quot;isa-week-date&quot;&gt;${[&#x27;Tue&#x27;,&#x27;Wed&#x27;,&#x27;Thu&#x27;,&#x27;Fri&#x27;][i]} ${date} Oct&lt;/p&gt;&lt;h2 class=&quot;isa-week-day&quot;&gt;Day ${d}&lt;/h2&gt;${rows(d,false,true)}${d===7?&#x27;&lt;p class=&quot;isa-halfday-note&quot;&gt;Half day · four sessions&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;/section&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;`;}
 function render(){
  product.dataset.group=group;
  root.querySelector(&#x27;.isa-cache&#x27;).hidden=!offline;
  root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;b.setAttribute(&#x27;aria-pressed&#x27;,String(b.dataset.view===view)));
  const heading=root.querySelector(&#x27;.isa-heading h1&#x27;),date=root.querySelector(&#x27;.isa-date&#x27;),dayBadge=root.querySelector(&#x27;.isa-heading .isa-day&#x27;),main=root.querySelector(&#x27;.isa-main-view&#x27;),secondary=root.querySelector(&#x27;.isa-next-section&#x27;);
  heading.textContent=view===&#x27;week&#x27;?&#x27;The coming week&#x27;:view===&#x27;next&#x27;?(state===&#x27;after&#x27;?&#x27;School’s out.&#x27;:state===&#x27;weekend&#x27;?&#x27;It’s the weekend.&#x27;:&#x27;Next school day&#x27;):&#x27;Today&#x27;;
  date.textContent=view===&#x27;today&#x27;?&#x27;Friday, 9 October&#x27;:view===&#x27;week&#x27;?&#x27;12–16 October&#x27;:&#x27;Back Tuesday, 13 October&#x27;;
  dayBadge.textContent=view===&#x27;today&#x27;?(kind===&#x27;holiday&#x27;?&#x27;Holiday&#x27;:&#x27;Day 5&#x27;):view===&#x27;week&#x27;?group:&#x27;Day &#x27;+nextDay();
  root.querySelector(&#x27;.isa-cycle&#x27;).hidden=group!==&#x27;3CS&#x27;;
  root.querySelector(&#x27;.isa-announcement&#x27;).textContent=group+&#x27; · &#x27;+heading.textContent+&#x27; · &#x27;+dayBadge.textContent;
  root.querySelector(&#x27;.isa-navigation a[href=&quot;#isa-cycle&quot;]&#x27;).hidden=group!==&#x27;3CS&#x27;;
  if(group!==&#x27;3CS&#x27;){main.innerHTML=`&lt;section class=&quot;isa-exception&quot;&gt;&lt;h2&gt;${group} timetable not published&lt;/h2&gt;&lt;p&gt;You’re viewing ${group}. A school administrator needs to publish its schedule.&lt;/p&gt;&lt;p&gt;Schoolwide notices remain available below.&lt;/p&gt;&lt;/section&gt;`;secondary.hidden=true;return;}
  secondary.hidden=false;
